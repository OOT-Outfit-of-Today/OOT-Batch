# ================================================================
# dev 프로파일 전용 설정 (Batch)
# ================================================================
spring:
  # ================================================================
  # 데이터베이스 연결 설정 (dev)
  # ================================================================
  datasource:
    # 예: jdbc:mysql://dev-host:3306/oot_batch
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # dev에서도 스키마는 손대지 않음
      ddl-auto: none

  # Spring Batch 메타데이터 테이블 자동 생성 (필요하다면)
  batch:
    jdbc:
      initialize-schema: always

  sql:
    init:
      # dev에서도 초기 데이터 항상 실행한다면 유지
      mode: always

  # ================================================================
  # Redis 연결 설정 추가(Lettuce 연결 풀)
  # host, port, password는 RedisConfig가 환경변수에서 직접 읽음
  # ================================================================
  data:
    redis:
      # Redis 연결 타임아웃
      timeout: 3000ms
      lettuce:
        pool:
          # 최대 활성 연결 수
          max-active: 10
          # 유휴 상태 최대 연결 수
          max-idle: 10
          # 유휴 상태 최소 연결 수(미리 생성)
          min-idle: 2
          # 연결 대기 시간(-1: 무제한)
          max-wait: -1ms

# 필요하면 dev 에서는 포트나 internal.api 도 override 가능
# server:
#   port: 8081
#
# internal:
#   api:
#     main-server-url: https://dev-main.your-domain.com