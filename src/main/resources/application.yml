# ================================================================
# Spring Boot 공통 설정 (Batch)
# ================================================================
spring:
  application:
    name: oot-batch
  profiles:
    # 환경변수 SPRING_PROFILES_ACTIVE 우선, 없으면 local
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ================================================================
  # .env 파일 로드 설정
  # ================================================================
  config:
    import: optional:file:.env[.properties]

  # ================================================================
  # DB 공통 설정
  # ================================================================
  datasource:
    # 드라이버는 공통으로 한 번만 선언
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 공통 정책
  jpa:
    hibernate:
      # 기본값: 스키마는 건드리지 않음 (프로파일에서 필요하면 override)
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  # ================================================================
  # Spring Batch 공통 설정
  # ================================================================
  batch:
    job:
      # 배치 Job 자동 실행 방지 (스케줄러/수동 실행만)
      enabled: false
    jdbc:
      # 메타데이터 테이블 자동 생성 여부는 프로파일에서 override 가능
      initialize-schema: never

  # ================================================================
  # SQL 초기화 (data.sql / schema.sql)
  # ================================================================
  sql:
    init:
      # 기본값: 항상 실행 (필요 시 프로파일에서 조정)
      mode: always

  # ================================================================
  # Redis 설정
  # ================================================================
  data:
    redis:
      # Redis Repository 자동 생성 비활성화(수동 설정 사용)
      repositories:
        enabled: false

# ================================================================
# 서버 공통 설정
# ================================================================
server:
  # 배치 서버 기본 포트 (환경별 override 가능)
  port: 8081

# ================================================================
# 내부 통신용 메인 서버 URL
# ================================================================
internal:
  api:
    # 기본값은 로컬 메인 서버
    main-server-url: ${MAIN_SERVER_URL:http://localhost:8080}