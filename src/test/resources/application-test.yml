# ============================================
# Test Profile 설정 (application-test.yml)
# ============================================
# 이 파일은 테스트 환경에서 사용되는 Spring Boot 설정입니다.
# CI/CD 파이프라인에서 테스트를 실행할 때 활성화됩니다.

spring:
  # ============================================
  # 데이터베이스 연결 설정 (DataSource Configuration)
  # ============================================
  datasource:
    # JDBC URL: 환경 변수를 통해 동적으로 설정
    # ${DB_HOST:127.0.0.1} 형식은 환경 변수가 없을 경우 기본값 사용
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:test_db}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    # 데이터베이스 사용자명 (환경 변수 또는 기본값 root)
    username: ${DB_USERNAME:root}
    # 데이터베이스 비밀번호 (환경 변수 또는 기본값 root)
    password: ${DB_PASSWORD:root}
    # MySQL JDBC 드라이버 클래스
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============================================
  # JPA / Hibernate 설정
  # ============================================
  jpa:
    hibernate:
      # DDL 자동 생성 전략: create-drop
      # 테스트 시작 시 테이블 생성, 종료 시 삭제
      ddl-auto: create-drop
    properties:
      hibernate:
        # SQL 쿼리를 포맷팅하여 가독성 향상
        format_sql: true
    # SQL 로그 출력 설정
    show-sql: true

  # ============================================
  # SQL 초기화 설정
  # ============================================
  sql:
    init:
      # mode: never로 설정하여 자동 SQL 스크립트 실행 비활성화
      # Hibernate의 ddl-auto를 사용하므로 중복 초기화 방지
      mode: never

  # ============================================
  # Redis 연결 설정
  # ============================================
  data:
    redis:
      # Redis 서버 호스트 (환경 변수 또는 기본값 127.0.0.1)
      host: ${REDIS_HOST:127.0.0.1}
      # Redis 서버 포트 (환경 변수 또는 기본값 6379)
      port: ${REDIS_PORT:6379}
      # Redis 비밀번호 (설정되지 않은 경우 빈 문자열)
      password: ${REDIS_PASSWORD:}
      # 연결 타임아웃: 3초
      timeout: 3000ms
      # Lettuce 커넥션 풀 설정
      lettuce:
        pool:
          # 최대 활성 커넥션 수
          max-active: 10
          # 최대 유휴 커넥션 수
          max-idle: 10
          # 최소 유휴 커넥션 수
          min-idle: 2
          # 커넥션 풀에서 커넥션을 기다리는 최대 시간 (-1은 무제한)
          max-wait: -1ms

  # ============================================
  # Spring Batch 설정
  # ============================================
  batch:
    jdbc:
      # Spring Batch 메타데이터 테이블 자동 초기화
      # ALWAYS: 항상 테이블 생성 (테스트 환경에 적합)
      initialize-schema: ALWAYS
