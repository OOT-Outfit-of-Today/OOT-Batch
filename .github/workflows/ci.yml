# ============================================
# CI/CD Workflow: Build & Test (Batch)
# ============================================
# 이 워크플로우는 Pull Request가 dev 브랜치로 생성될 때 자동으로 실행되어
# 코드를 빌드하고 테스트를 수행합니다.

name: CI (Batch)

# ============================================
# 트리거 조건 (Trigger)
# ============================================
# pull_request: PR이 생성되거나 업데이트될 때 실행
# branches: dev 브랜치를 대상으로 하는 PR만 트리거
on:
  pull_request:
    branches: [ dev ]

# ============================================
# Job 정의
# ============================================
jobs:
  build:
    # Job 이름: GitHub Actions UI에 표시되는 이름
    name: Build & Test (Batch)
    
    # 실행 환경: Ubuntu 최신 버전 사용
    runs-on: ubuntu-latest
    
    # ============================================
    # 서비스 컨테이너 (Service Containers)
    # ============================================
    # 테스트 실행 시 필요한 MySQL과 Redis를 Docker 컨테이너로 실행
    # GitHub Actions에서는 서비스 컨테이너가 호스트 네트워크에서 실행되므로
    # localhost를 통해 접근해야 합니다.
    services:
      # MySQL 데이터베이스 서비스
      mysql:
        image: mysql:8.0  # MySQL 8.0 이미지 사용
        env:
          # MySQL 루트 비밀번호 설정
          MYSQL_ROOT_PASSWORD: root
          # 테스트용 데이터베이스 자동 생성
          MYSQL_DATABASE: test_db
        ports:
          # 호스트의 3306 포트를 컨테이너의 3306 포트와 매핑
          - 3306:3306
        options: >-
          # Health Check: MySQL이 완전히 시작될 때까지 대기
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      # Redis 캐시 서비스
      redis:
        image: redis:7-alpine  # 경량화된 Redis 7 Alpine 이미지 사용
        ports:
          # 호스트의 6379 포트를 컨테이너의 6379 포트와 매핑
          - 6379:6379
        options: >-
          # Health Check: Redis가 완전히 시작될 때까지 대기
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    
    # ============================================
    # 실행 단계 (Steps)
    # ============================================
    steps:
      # Step 1: 코드 체크아웃
      # 현재 브랜치의 소스 코드를 가져옵니다
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Step 2: JDK 17 설정
      # Java 17 환경을 설정합니다 (Temurin 배포판 사용)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      # Step 3: Gradle 설정
      # Gradle 빌드 도구를 설정하고 캐싱을 활성화합니다
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      
      # Step 4: Gradlew 실행 권한 부여
      # gradlew 스크립트에 실행 권한을 부여합니다
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew
      
      # Step 5: 환경 변수 설정
      # 테스트 실행 시 필요한 환경 변수를 설정합니다
      # 주의: GitHub Actions의 서비스 컨테이너는 localhost를 통해 접근합니다!
      - name: Configure environment variables
        run: |
          echo "SPRING_PROFILES_ACTIVE=test" >> $GITHUB_ENV
          # MySQL 연결 정보 (localhost 사용!)
          echo "DB_HOST=localhost" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV
          echo "DB_NAME=test_db" >> $GITHUB_ENV
          echo "DB_USERNAME=root" >> $GITHUB_ENV
          echo "DB_PASSWORD=root" >> $GITHUB_ENV
          # Redis 연결 정보 (localhost 사용!)
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=" >> $GITHUB_ENV
      
      # Step 6: 빌드 (테스트 제외)
      # 테스트를 제외하고 애플리케이션을 빌드합니다
      # clean: 이전 빌드 산출물 삭제
      # build: 애플리케이션 빌드
      # -x test: 테스트 제외
      # --stacktrace: 오류 발생 시 상세한 스택 트레이스 출력
      - name: Build without tests
        run: ./gradlew clean build -x test --stacktrace
      
      # Step 7: 테스트 실행
      # JUnit 테스트를 실행합니다
      # test: 테스트 실행
      # --stacktrace: 오류 발생 시 상세한 스택 트레이스 출력
      - name: Run tests
        run: ./gradlew test --stacktrace
