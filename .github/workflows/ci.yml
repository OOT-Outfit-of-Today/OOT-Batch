name: CI (Batch)

on:
  pull_request:
    branches: [ dev ]

jobs:
  build:
    name: Build & Test (Batch)
    runs-on: ubuntu-latest

    # ================================================================
    # Docker 서비스 컨테이너 정의
    # ================================================================
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # ================================================================
      # 환경 변수 설정
      # ================================================================
      - name: Configure environment variables
        run: |
          echo "SPRING_PROFILES_ACTIVE=test" >> $GITHUB_ENV

          # DB (application-test.yml 기준)
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV
          echo "DB_NAME=test_db" >> $GITHUB_ENV
          echo "DB_USERNAME=root" >> $GITHUB_ENV
          echo "DB_PASSWORD=root" >> $GITHUB_ENV

          # Redis (application-test.yml 기준)
          echo "REDIS_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "REDIS_PORT=6379" >> $GITHUB_ENV
          echo "REDIS_PASSWORD=" >> $GITHUB_ENV

      # ================================================================
      # MySQL 완전 기동 대기 (핵심)
      # ================================================================
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            echo "⌛ Checking MySQL..."
            if mysqladmin ping -h "127.0.0.1" -P 3306 --silent; then
              echo "✅ MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ MySQL did not become ready in time"
          exit 1

      # ================================================================
      # 빌드 및 테스트 실행(단계별 디버깅)
      # ================================================================
      - name: Build without tests (컴파일만)
        run: ./gradlew clean build -x test --stacktrace

      - name: Run only context load test (Spring 시작만)
        run: ./gradlew test --tests "*ApplicationTests" --stacktrace 2>&1 | tee test-output.log
        continue-on-error: true

      - name: Show full error if failed
        if: failure()
        run: |
          echo "=== 전체 에러 로그 ==="
          cat test-output.log || echo "test-output.log not found"
          echo ""
          echo "=== 핵심 에러만 추출 ==="
          grep -A 20 "Caused by:" test-output.log || echo "Caused by를 찾을 수 없음"