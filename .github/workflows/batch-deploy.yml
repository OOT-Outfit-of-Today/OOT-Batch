name: Deploy Batch (dev)

on:
  push:
    branches: [ "dev" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
  ECR_REPO: ${{ secrets.ECR_REPO_BATCH }}          # 🟡 배치용 ECR 리포 이름
  IMAGE_TAG: ${{ github.sha }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID_BATCH }}  # 🟡 배치 서버 EC2 인스턴스 ID
  CONTAINER_NAME: batch-app                         # 🟡 컨테이너 이름
  APP_PORT: "8081"                                  # 배치 서버 포트 (application.yml 기준)
  SPRING_PROFILE: dev                               # 배치용 dev 프로필

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-batch-dev
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & Push to ECR
        id: push
        run: |
          ./scripts/ecr-push.sh

      - name: Deploy on EC2 via SSM
        env:
          FULL_URI: ${{ steps.push.outputs.FULL_URI }}
        run: |
          ./scripts/deploy.sh

      - name: Verify container
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=${EC2_INSTANCE_ID}" \
            --parameters commands="[
              \"docker ps --format 'table {{.Names}}\\t{{.Image}}\\t{{.Status}}'\"
            ]" \
            --region $AWS_REGION --output json